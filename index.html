<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi QR Sekolah</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #0f766e;
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .student {
      display: none;
    }

    .student h2 {
      margin-top: 0;
      color: #0f766e;
    }

    .data-row {
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .label {
      font-size: 12px;
      color: #64748b;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-scan {
      background: #0f766e;
      color: white;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>ABSENSI QR SISWA</h1>
    <p>Sistem Absensi Sekolah</p>
  </div>

  <div class="card">

    <div id="reader"></div>

    <div id="status" class="status">
      Arahkan kamera ke QR Code siswa
    </div>

  </div>

  <div id="studentCard" class="card student">

    <h2>✓ SISWA DITEMUKAN</h2>

    <div class="data-row">
      <div class="label">ID SISWA</div>
      <div id="studentId" class="value">-</div>
    </div>

    <div class="data-row">
      <div class="label">NAMA</div>
      <div id="studentName" class="value">-</div>
    </div>

    <div class="data-row">
      <div class="label">NIS</div>
      <div id="studentNis" class="value">-</div>
    </div>

    <div class="data-row">
      <div class="label">KELAS</div>
      <div id="studentClass" class="value">-</div>
    </div>
    
    <button id="btnHadir" class="btn-hadir" onclick="catatHadir()" style="display:none;">
      ✓ CATAT HADIR
    </button>
    
    <button class="btn-scan" onclick="startScanner()">
      SCAN SISWA BERIKUTNYA
    </button>

  </div>

  <div class="footer">
    Sistem Kartu Pelajar Digital & Absensi QR
  </div>

</div>

<script>

let scanner;

function startScanner() {

  document.getElementById("studentCard").style.display = "none";

  document.getElementById("status").innerHTML =
    "Arahkan kamera ke QR Code siswa";

  document.getElementById("status").className =
    "status";

  if (scanner) {
    try {
      scanner.clear();
    } catch (e) {
    }
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      scanner.stop().then(() => {

        tampilkanSiswa(decodedText);

      }).catch(() => {

        tampilkanSiswa(decodedText);

      });

    },

    function(errorMessage) {
      // Abaikan error scanning sementara
    }

  ).catch(function(error) {

    document.getElementById("status").innerHTML =
      "❌ Kamera tidak dapat digunakan.<br>Pastikan izin kamera diberikan.";

    document.getElementById("status").className =
      "status error";

    console.log(error);

  });

}


function tampilkanSiswa(qrData) {

  document.getElementById("status").innerHTML =
    "⏳ Mencari data siswa...";

  document.getElementById("status").className =
    "status";


  const API_URL =
    "https://script.google.com/macros/s/AKfycbyGEG-4YUswXDv2CMfMvX69nd_HQEs6InlW9lS3vUWS3ljZBUHguHZ8lMGXl5OM7ZCo/exec";


  const callbackName = "callbackSiswa_" + Date.now();


  window[callbackName] = function(data) {

    if (data.found) {

      document.getElementById("studentId").innerText =
        data.id || "-";

      document.getElementById("studentName").innerText =
        data.nama || "-";

      document.getElementById("studentNis").innerText =
        data.nis || "-";

      document.getElementById("studentClass").innerText =
        data.kelas || "-";


      document.getElementById("studentCard").style.display =
        "block";

      document.getElementById("btnHadir").style.display =
        "block";

      document.getElementById("status").innerHTML =
        "✓ DATA SISWA DITEMUKAN";

      document.getElementById("status").className =
        "status success";

    } else {

      document.getElementById("status").innerHTML =
        "❌ SISWA TIDAK DITEMUKAN";

      document.getElementById("status").className =
        "status error";

    }

    function catatHadir() {
  const idSiswa = document.getElementById("studentId").innerText;
  const btn = document.getElementById("btnHadir");

  if (!idSiswa || idSiswa === "-") {
    alert("Silakan scan QR siswa terlebih dahulu.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "⏳ MENYIMPAN...";

  const callbackName = "callbackAbsensi_" + Date.now();

  window[callbackName] = function(data) {

    if (data.success) {
      document.getElementById("status").innerHTML =
        "✓ ABSENSI BERHASIL DICATAT";

      document.getElementById("status").className =
        "status success";

      btn.innerText = "✓ SUDAH HADIR";

      alert(
        "Absensi berhasil dicatat untuk " +
        (data.siswa || "siswa")
      );

    } else if (data.duplicate) {

      document.getElementById("status").innerHTML =
        "⚠ SISWA SUDAH ABSEN HARI INI";

      document.getElementById("status").className =
        "status error";

      btn.innerText = "⚠ SUDAH ABSEN";

    } else {

      document.getElementById("status").innerHTML =
        "❌ GAGAL MENCATAT ABSENSI";

      document.getElementById("status").className =
        "status error";

      btn.disabled = false;
      btn.innerText = "✓ CATAT HADIR";

      alert(data.message || "Absensi gagal dicatat.");
    }

    delete window[callbackName];
  };

  const url =
    API_URL +
    "?action=recordAttendance" +
    "&id=" + encodeURIComponent(idSiswa) +
    "&callback=" + callbackName;

  const script = document.createElement("script");
  script.src = url;

  script.onerror = function() {
    btn.disabled = false;
    btn.innerText = "✓ CATAT HADIR";

    document.getElementById("status").innerHTML =
      "❌ Koneksi ke server gagal";

    document.getElementById("status").className =
      "status error";

    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

    // Hapus script sementara
    script.remove();

    // Hapus callback
    delete window[callbackName];

  };


  // Membuat URL API
  const url =
    API_URL +
    "?action=getStudent" +
    "&id=" + encodeURIComponent(qrData) +
    "&callback=" + callbackName;


  // JSONP request
  const script = document.createElement("script");

  script.src = url;

  document.body.appendChild(script);

}

/*
  Jalankan scanner ketika halaman dibuka
*/

window.onload = function() {
  startScanner();
};

</script>

</body>
</html>
